name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: Release

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests with coverage
        shell: bash
        env:
          SWTSHARP_DEBUG: 1  # Enable diagnostic logging for platform detection debugging
        run: |
          dotnet test tests/SWTSharp.Tests/SWTSharp.Tests.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: |
            ./TestResults/**/*.trx
            ./TestResults/**/coverage.cobertura.xml
          retention-days: 30

  test-macos:
    name: Test on macOS (All Tests with CFRunLoop)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      # NOTE: GitHub Actions macOS runners have WindowServer running with loginwindow active
      # Platform-specific tests are filtered at discovery time via IXunitTestCaseDiscoverer
      # Tests that require Thread 1 should use the appropriate platform attributes

      # macOS GUI tests require Thread 1 for CFRunLoop - use custom test runner
      - name: Run tests with custom runner
        timeout-minutes: 5  # Prevent infinite hanging on macOS
        env:
          SWTSHARP_DEBUG: 1  # Enable diagnostic logging for platform detection debugging
        run: |
          dotnet run --project tests/SWTSharp.Tests/SWTSharp.Tests.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            -- --results-directory ./TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-macos
          path: |
            ./TestResults/**/*.trx
            ./TestResults/**/coverage.cobertura.xml
          retention-days: 30

  test-linux:
    name: Test on Linux with CodeQL, Package & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for version calculation

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          config-file: .github/codeql/codeql-config.yml

      - name: Setup Xvfb and GTK/WebKit (Virtual Display for GUI Tests)
        run: |
          sudo apt-get update
          # Install GTK3 and X11 dependencies
          sudo apt-get install -y xvfb libgtk-3-0 libglib2.0-0 libx11-dev
          # Install WebKitGTK - need BOTH versions:
          # - 4.1 for NET 5.0+ dynamic loading on Ubuntu 24.04
          # - 4.0 for netstandard2.0 which uses hardcoded DllImport("libwebkit2gtk-4.0.so.37")
          # Install 4.1 first (required on 24.04), then 4.0 if available (may not exist on newer distros)
          sudo apt-get install -y libwebkit2gtk-4.1-0
          sudo apt-get install -y libwebkit2gtk-4.0-37 || true
          # Start Xvfb on display :99
          sudo Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          # Wait for Xvfb to be ready
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests with coverage
        shell: bash
        env:
          SWTSHARP_DEBUG: 1  # Enable diagnostic logging for platform detection debugging
          DISPLAY: :99
          NO_AT_BRIDGE: 1  # Disable AT-SPI accessibility bridge to prevent crash when dbus not running
          GTK_A11Y: none  # Disable GTK accessibility (GTK 4 style, also works for GTK 3)
          LIBGL_ALWAYS_SOFTWARE: 1  # Force software rendering for Mesa/OpenGL
          GDK_BACKEND: x11  # Force X11 backend (not Wayland) for GTK
          MESA_GL_VERSION_OVERRIDE: 3.3  # Override Mesa GL version if needed
          WEBKIT_DISABLE_COMPOSITING_MODE: 1  # Disable WebKit hardware acceleration to avoid EGL/DRI3 errors
          WEBKIT_DISABLE_DMABUF_RENDERER: 1  # Disable WebKit DMA-BUF renderer
          G_DEBUG: ''  # Prevent GTK from treating criticals as fatal
        run: |
          # Run tests, capturing stderr separately to prevent GTK criticals from crashing the test host
          # The test host interprets GTK-CRITICAL messages as crashes even when all tests pass
          dotnet test tests/SWTSharp.Tests/SWTSharp.Tests.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults 2>gtk-stderr.log || true

          # Show GTK warnings for debugging (not fatal)
          if [ -f gtk-stderr.log ] && [ -s gtk-stderr.log ]; then
            echo "=== GTK stderr output (informational) ==="
            cat gtk-stderr.log
          fi

          # Check the TRX file for actual individual test failures
          # Note: ResultSummary outcome="Failed" can appear due to test host abort (GTK criticals)
          # even when all individual tests pass, so we check UnitTestResult elements instead
          if [ -f ./TestResults/test-results.trx ]; then
            FAILED_COUNT=$(grep -c '<UnitTestResult.*outcome="Failed"' ./TestResults/test-results.trx || true)
            if [ "$FAILED_COUNT" -gt 0 ]; then
              echo "::error::$FAILED_COUNT test(s) actually failed"
              exit 1
            fi
            echo "All individual tests passed (GTK criticals are non-fatal warnings)"
          else
            echo "::error::No test results file found"
            exit 1
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-linux
          path: |
            ./TestResults/**/*.trx
            ./TestResults/**/coverage.cobertura.xml
          retention-days: 30

      - name: Create NuGet package
        run: dotnet pack --configuration ${{ env.CONFIGURATION }} --no-build --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 90

      - name: Upload NuGet symbols
        uses: actions/upload-artifact@v6
        with:
          name: nuget-symbols
          path: ./artifacts/*.snupkg
          retention-days: 90

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          body: |
            ## Release ${{ steps.version.outputs.VERSION }}

            ### Installation
            ```bash
            dotnet add package SWTSharp --version ${{ steps.version.outputs.VERSION }}
            ```

            ### NuGet Package
            https://www.nuget.org/packages/SWTSharp/${{ steps.version.outputs.VERSION }}

            ### What's Changed
            See commit history for detailed changes.

            ### Artifacts
            - NuGet package (.nupkg)
            - Debug symbols (.snupkg)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Merge coverage from all platforms and upload to Codecov
  merge-coverage:
    name: Merge Coverage
    needs: [test-windows, test-macos, test-linux]
    runs-on: ubuntu-latest
    if: always() && (needs.test-windows.result == 'success' || needs.test-macos.result == 'success' || needs.test-linux.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: test-results-*
          path: ./coverage
          merge-multiple: true

      - name: Display coverage structure
        run: find ./coverage -name "*.xml" -type f

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
