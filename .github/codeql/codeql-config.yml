name: "SWTSharp CodeQL Configuration"

# Disable rules that are expected for a native interop library
# SWTSharp wraps GTK/Win32/Cocoa native APIs via P/Invoke - unmanaged code is unavoidable

queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
  # Unmanaged code - unavoidable for native interop library
  - exclude:
      id: cs/unmanaged-code
  - exclude:
      id: cs/call-to-unmanaged-code
  # Style suggestions not applicable to native interop patterns
  - exclude:
      id: cs/missed-using-statement
